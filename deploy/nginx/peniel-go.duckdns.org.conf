# Nginx site config for peniel-go.duckdns.org.
#
# Install:
#   sudo cp deploy/nginx/peniel-go.duckdns.org.conf /etc/nginx/sites-available/peniel-go.duckdns.org
#   sudo ln -s /etc/nginx/sites-available/peniel-go.duckdns.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d peniel-go.duckdns.org` — certbot rewrites this file
# in place to add the HTTPS server block and the HTTP -> HTTPS redirect.
#
# `root` below must match the path the repo is cloned to on the VPS (see docs/deploy-vps.md).
# Repo is expected under /root — that requires `chmod o+x /root` (traverse only, not list)
# so the www-data user nginx runs as can reach into it; docs/deploy-vps.md covers this.

server {
    listen 80;
    listen [::]:80;
    server_name peniel-go.duckdns.org;

    root /root/peniel_go/frontend/dist;
    index index.html;

    # API Gateway — only reachable on 127.0.0.1:8888 from the host, proxied here over TLS.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8888/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Destination photos — the gateway proxies these from recommendation-service's
    # filesystem too (see api-gateway/app/routing/destination_routes.py); without this
    # block requests fall through to the SPA fallback below and get index.html instead.
    location /static/ {
        proxy_pass http://127.0.0.1:8888/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA — let client-side routing handle unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
